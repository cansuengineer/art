<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cansu Sarp Art Catalog</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="bg-warning text-white text-center py-5">
        <h1>Welcome to My Art Gallery</h1>
        <p class="lead">This is an art catalog</p>
    </header>
    <main class="container my-5">
        <div class="row">
            <div class="col-md-4">

             <!-- <h2>column 1</h2> --> 
                <div style="grid-template-rows: 1fr 1fr;" class="d-grid gap-2">
                    <div class="p-2">
                        <img src="src/images/lion.png" class="img-fluid" alt="...">
                    </div>
                    <div class="p-2">
                        <img src="src/images/rhino.png" class="img-fluid" alt="...">
                    </div>
                       <div class="p-2">
                            <img src="src/images/balik1.png" class="img-fluid" alt="...">
                        </div>
                </div>

            </div>
            <div class="col-md-4">
                <!-- <h2>column 2</h2> --> 
                <div style="grid-template-rows: 1fr 1fr;" class="d-grid gap-2">
                    <div class="p-2">
                        <img src="src/images/jaguar.png" class="img-fluid" alt="...">
                    </div>
                    <div class="p-2">
                        <img src="src/images/Balik6.png" class="img-fluid" alt="...">
                    </div>
                       <div class="p-2">
                            <img src="src/images/cat2.png" class="img-fluid" alt="...">
                        </div>
                </div>
            </div>
            <div class="col-md-4">
                <!--nav element başlangıç--> 
                 <!-- <h2>column 3</h2> --> 
                <div style="grid-template-rows: 1fr 1fr;" class="d-grid gap-2">
                    <div class="p-2">
                        <img src="src/images/cat.png" class="img-fluid" alt="...">
                    </div>
                    <div class="p-2">
                        <img src="src/images/fil.png" class="img-fluid" alt="...">
                        </div>
                        <div class="p-2">
                            <img src="src/images/kalamar.png" class="img-fluid" alt="...">
                        </div>
                    </div>
                </div>
            </div>




        </div>
    </main>
    <footer class="bg-dark text-white text-center py-3">
        <p>&copy; 2026 copyright Cansu Sarp </p>
    </footer>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
